id: lumid-findata-example
version: 0.1.0
description: |
  Minimal xpio app demonstrating lumid-findata-skill. One loop runs every
  hour, pulls fresh news + price targets for a watchlist of symbols, and
  writes a summary memory back to the agent bank.

# The single line that pulls in every findata verb:
skill_imports:
  - lumid/lumid-findata-skill@>=0.1.0

roles:
  - id: watchlist_observer
    agent: lumid-findata-observer

loops:
  - name: watchlist_news_pull
    schedule: "47 * * * *"      # hourly at :47 (off-peak)
    primary_role: watchlist_observer
    knowledge_agent: lumid-findata-observer
    steps:
      - skill: findata.news.latest
        args: { category: stock, limit: 50 }
        as: stock_news
      - skill: findata.news.search
        args: { q: "earnings beat -guidance", limit: 20 }
        as: earnings_news
      - skill: findata.quote.snapshot
        args: { symbols: ["AAPL", "MSFT", "NVDA", "META", "GOOGL"] }
        as: snapshots
      - skill: knowledge.learn
        args:
          type: market_snapshot
          tags: ["watchlist", "hourly"]
          content: |
            Stock-news headlines: {{ stock_news | length }} items.
            Earnings beats this hour: {{ earnings_news | length }}.
            Last ticks: {{ snapshots | tojson }}
