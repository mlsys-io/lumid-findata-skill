id: findata.screener
version: 0.1.0
summary: Filter the universe by sector / industry / country / market cap / instrument type.
auth: lumid-pat
impl: impl.py:call
inputs:
  sector:           {type: string,  required: false}
  industry:         {type: string,  required: false}
  country:          {type: string,  required: false, description: ISO code, e.g. `US`}
  exchange:         {type: string,  required: false}
  is_etf:           {type: boolean, required: false}
  is_fund:          {type: boolean, required: false}
  market_cap_min:   {type: number,  required: false, description: USD}
  market_cap_max:   {type: number,  required: false, description: USD}
  symbol_prefix:    {type: string,  required: false}
  limit:            {type: integer, required: false, default: 100, minimum: 1, maximum: 1000}
  offset:           {type: integer, required: false, default: 0,   minimum: 0}
outputs:
  type: object
  description: |
    `{count: <total before paging>, returned: <len of hits>, hits: [...]}`.
    Each hit: `{symbol, name, exchange, country, sector, industry,
    market_cap, is_etf, is_fund}`. Ordered by market_cap descending.
