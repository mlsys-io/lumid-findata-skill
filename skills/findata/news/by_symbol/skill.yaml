id: findata.news.by_symbol
version: 0.1.0
summary: Recent articles for one symbol, deduped by URL across all providers.
auth: lumid-pat
impl: impl.py:call
inputs:
  symbol: {type: string,  required: true}
  since:  {type: string,  required: false, description: ISO-8601 floor (default last 30 d)}
  limit:  {type: integer, required: false, default: 50, minimum: 1, maximum: 200}
outputs:
  type: array
  description: List of `{published_at, publisher, headline, summary, url, category}`.
