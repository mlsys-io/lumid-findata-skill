id: findata.news.latest
version: 0.1.0
summary: Global news firehose, newest first, optionally filtered by category.
auth: lumid-pat
impl: impl.py:call
inputs:
  category:
    type: string
    required: false
    description: |
      Optional filter. One of `general` (macro / financial-news),
      `stock` (stock-market firehose), `press` (press releases),
      `crypto`, `forex`, `company` (per-symbol stock news).
  since:
    type: string
    required: false
    description: ISO-8601 floor. Default last 30 days.
  limit:
    type: integer
    default: 50
    minimum: 1
    maximum: 200
outputs:
  type: array
  description: List of `{published_at, publisher, headline, summary, url, category, symbol}`.
