id: findata.symbol.get
version: 0.1.0
summary: Look up one symbol's profile (sector / industry / market cap / ipo date).
auth: lumid-pat
impl: impl.py:call
inputs:
  symbol:
    type: string
    required: true
    description: Ticker, e.g. `AAPL`, `BTCUSD`, `EURUSD`, `QQQ`.
outputs:
  type: object
  description: |
    {symbol, name, exchange, country, sector, industry, market_cap,
     is_etf, is_fund, ipo_date}. Returns null if the symbol isn't
     known to the warehouse.
