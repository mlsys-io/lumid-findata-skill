id: findata.symbols.search
version: 0.1.0
summary: Substring search across the unified symbol catalog (equities + ETFs + crypto + forex + indices).
auth: lumid-pat
impl: impl.py:call
inputs:
  q:
    type: string
    required: true
    description: Search query (case-insensitive prefix-or-substring on ticker and company name).
  limit:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
outputs:
  type: array
  description: List of `{symbol, name, sector, industry}` hits ordered by best match.
