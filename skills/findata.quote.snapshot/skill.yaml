id: findata.quote.snapshot
version: 0.1.0
summary: Last-known tick per symbol from the realtime cache (up to 100 symbols/call).
auth: lumid-pat
impl: impl.py:call
inputs:
  symbols:
    type: array
    items: {type: string}
    required: true
    minItems: 1
    maxItems: 100
    description: Tickers (any asset class).
outputs:
  type: array
  description: |
    One entry per requested symbol: `{symbol, ts, price, bid, ask, volume,
    change_pct, source, latency_ms}`. Missing entries return
    `{ts: null, source: "no_cache"}`.
